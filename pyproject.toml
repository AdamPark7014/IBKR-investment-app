[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ibtrader"
version = "0.1.0"
description = "Production-grade algorithmic trading system for Interactive Brokers (paper-first, strong risk controls)."
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "Adam Park", email = "adam@example.com" }
]
license = { text = "MIT" }
keywords = ["trading", "interactive-brokers", "algorithmic-trading", "backtesting", "ibkr"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "pandas==2.2.2",
  "numpy==2.1.1",
  "pydantic==2.8.2",
  "pydantic-settings==2.4.0",
  "typer==0.12.3",
  "click==8.1.7",
  "rich==13.7.1",
  "structlog==24.2.0",
  "SQLAlchemy==2.0.34",
  # Use yfinance 1.x; handle MultiIndex flatten in code
  "yfinance>=1.7.0,<2.0.0",
  "pyarrow==17.0.0",
  "matplotlib==3.9.0",
  "plotly==5.23.0",
  "python-dotenv==1.0.1",
  "ib_async==2.1.0",
  "python-json-logger==2.0.7",
  "requests==2.32.3",
  "PyYAML==6.0.2",
  "scikit-learn==1.5.2",
  "scipy==1.13.1",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.2",
  "pytest-cov==5.0.0",
  "ruff==0.6.2",
  "mypy==1.11.2",
]

[project.urls]
Homepage = "https://github.com/adam/ibkr-investment-app"
Issues = "https://github.com/adam/ibkr-investment-app/issues"

[project.scripts]
ibtrader = "ibtrader.ops.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ibtrader*"]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = ["data/**", "build/**", "dist/**"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q --color=yes"
testpaths = [
    "tests",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
no_implicit_optional = true
exclude = ["data/"]


